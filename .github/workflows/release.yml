# Pushing a tag like v0.1.1 builds the installers on GitHub's machines and
# publishes them as a release. Start one with: npm run release -- 0.1.1
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > notes.md
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Dynamic Island ${VERSION}" --notes-file notes.md --verify-tag

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # 22.04: older glibc, so the .deb/.rpm also run on older distros.
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - run: npm ci

      # With the signing key (repo secrets), Windows also gets signed update
      # packages for the in-app updater. Without it the build still works.
      - name: Build installers
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            [ "$RUNNER_OS" = "Windows" ] && echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY: esta versión no tendrá actualización automática"
            npx tauri build
          fi

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          B=src-tauri/target/release/bundle
          mkdir out
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$B/nsis/Dynamic Island_${VERSION}_x64-setup.exe" "out/DynamicIsland_${VERSION}_x64-setup.exe"
            cp "$B"/msi/*.msi "out/DynamicIsland_${VERSION}_x64.msi"
            # latest.json: what the in-app updater reads (only when signed).
            SIG="$B/nsis/Dynamic Island_${VERSION}_x64-setup.exe.sig"
            if [ -f "$SIG" ]; then
              node .github/latest-json.mjs "$VERSION" "$SIG" "$(ls "$B"/msi/*.msi.sig)" > out/latest.json
            fi
            # Portable .zip: for networks that block .exe / .msi downloads. No install, no admin.
            P="out/portable/Dynamic Island"
            mkdir -p "$P"
            cp src-tauri/target/release/dynamic-island.exe src-tauri/target/release/island-hook.exe "$P/"
            sed "s/{{VERSION}}/${VERSION}/g" .github/portable-LEEME.txt > "$P/LEEME.txt"
            (cd out/portable && 7z a -tzip -bso0 "../DynamicIsland_${VERSION}_x64-portable.zip" "Dynamic Island")
            rm -rf out/portable
          else
            cp "$B/deb/Dynamic Island_${VERSION}_amd64.deb" "out/dynamic-island_${VERSION}_amd64.deb"
            cp "$B/rpm/Dynamic Island-${VERSION}-1.x86_64.rpm" "out/dynamic-island-${VERSION}-1.x86_64.rpm"
          fi
          gh release upload "$GITHUB_REF_NAME" out/* --clobber
